schema_version: 1

context:
  name: uf3
  version: "0.4.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/uf3-${{ version }}.tar.gz
  sha256: 10b706822d217a6407ddac40bda54bce9ea56ffd78ef6ddbe687924a203fb893

build:
  number: 3
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - ase
    - matplotlib-base
    - ndsplines
    - numba
    - numpy
    - pandas
    - plotly
    - pyyaml
    - scikit-learn
    - scipy
    - pytables
    - tqdm

tests:
  - python:
      imports:
        - uf3
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Ultra-Fast Force Fields for molecular dynamics
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/uf3/uf3

extra:
  recipe-maintainers:
    - jan-janssen
